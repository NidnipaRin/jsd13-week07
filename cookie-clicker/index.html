<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strawberry Bun Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1. ฝั่งซ้าย: Click & Info Panel -->
  <div class="left-panel" id="clickPanel">
    <div class="header-info">
      <span class="sub-title">THE RINGREDIENTS BAKERY CONTROL</span>
      <!-- ตัวเลขที่จะให้ JS มาอัปเดต -->
      <h1 id="clickCount">0</h1>
      <span class="unit-text">Strawberry Buns Baked</span>
      <p class="rate-text">Baking Rate: <span id="bakeRate">0</span> / sec</p>
    </div>

    <div class="main-bun-container">
      <!-- ปุ่มขนมปังหลักสำหรับกดคลิก -->
      <img src="strawberrybun.png" alt="Strawberry Bun" class="main-bun" id="bunBtn">
    </div>

    <div class="footer-info">
      <p class="quote">" Freshly baked with love, strawberries & sweetness... "</p>
      <div class="disclaimer">
        <strong>Disclaimer:</strong> Welcome to The Ringredients...
      </div>
      <div class="slogan">May the Sweetness be with you</div>
      <div class="game-title">STRAWBERRY BUN CLICKER!</div>
      <div class="author">by Rin</div>
    </div>
  </div>

  <!-- 2. ฝั่งกลาง: Center Panel (เดี๋ยวเราจะมาต่อกล่องรางวัลกัน) -->
  <div class="center-panel">
    <!-- ใส่เนื้อหาฝั่งกลาง -->
  </div>

  <!-- 3. ฝั่งขวา: Shop Panel (เดี๋ยวเราจะมาต่อ Shop Items กัน) -->
  <div class="right-panel">
    <!-- ใส่เนื้อหาฝั่งขวา -->
  </div>

  <script src="script.js"></script>
</body>
</html>
